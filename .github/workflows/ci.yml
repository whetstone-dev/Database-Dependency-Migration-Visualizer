name: validate
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global pnpm@12.10.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm verify:examples
      - run: pnpm build
      - run: pnpm test:browser
      - run: pnpm benchmark
      - run: pnpm pack --pack-destination dist/v0.3.0
      - run: pnpm package:skill
      - run: pnpm package:site
      - run: pnpm smoke:artifacts
  catalog:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ["14.20", "15.15", "16.11", "17.7", "18.1"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: fixture_owner
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: dbdep_examples
        ports: ["5432:5432"]
        options: >-
          --health-cmd 'pg_isready -U fixture_owner -d dbdep_examples'
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global pnpm@12.10.1
      - run: pnpm install --frozen-lockfile
      - run: node scripts/setup-ci-fixture.mjs
        env:
          DBDEP_FIXTURE_OWNER_DSN: postgresql://fixture_owner@127.0.0.1:5432/dbdep_examples
      - run: node --test tests/node/live.test.mjs
        env:
          DBDEP_TEST_DSN: postgresql://dbdep_readonly@127.0.0.1:5432/dbdep_examples
