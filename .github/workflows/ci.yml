name: validate
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,live]'
      - run: python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: python -m ruff check src scripts tests
      - run: python -m ruff format --check src scripts tests
      - run: python -m pytest -q
      - run: python scripts/verify_examples.py
      - run: python scripts/benchmark.py
      - run: python -m build
  catalog:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ['14.20', '15.15', '16.11', '17.7', '18.1']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: fixture_owner
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: dbdep_examples
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U fixture_owner -d dbdep_examples'
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,live]'
      - run: python scripts/setup_ci_fixture.py
        env:
          DBDEP_FIXTURE_OWNER_DSN: host=127.0.0.1 port=5432 user=fixture_owner dbname=dbdep_examples
      - run: python -m pytest tests/test_live.py -q
        env:
          DBDEP_TEST_DSN: host=127.0.0.1 port=5432 user=dbdep_readonly dbname=dbdep_examples
