[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "database-dependency-migration"
version = "0.1.0"
description = "Evidence-backed PostgreSQL dependencies and review-only migration analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pglast==8.5", "jsonschema==4.26.0"]

[project.optional-dependencies]
live = ["psycopg[binary]==3.3.2"]
dev = ["pytest==8.4.2", "playwright==1.56.0", "ruff==0.14.0", "PyYAML==6.0.3", "build==1.3.0"]

[project.scripts]
dbdep = "dbdep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/dbdep/schemas" = ["schemas/*.json"]
"share/dbdep/assets/viewer" = ["assets/viewer/*"]
"share/dbdep/examples/ecommerce" = ["examples/ecommerce/schema.sql"]
"share/dbdep/examples/ecommerce/app" = ["examples/ecommerce/app/*.sql"]
"share/dbdep/examples/ecommerce/migrations" = ["examples/ecommerce/migrations/*.sql"]
"share/dbdep/examples/analytics" = ["examples/analytics/*.sql", "examples/analytics/*.json"]
"share/dbdep/examples/high-traffic" = ["examples/high-traffic/*.json"]
"share/dbdep/examples/high-traffic/migrations" = ["examples/high-traffic/migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["browser: Chromium interaction tests", "live: isolated PostgreSQL integration tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
